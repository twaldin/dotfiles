unbind-key C-b
set-option -g prefix C-space
bind-key C-Space send-prefix
set-option -g focus-events on
set -g base-index 1
setw -g pane-base-index 1
set-option -g renumber-windows on
bind-key -r f run-shell "tmux neww ~/scripts/tmux_sessionizer.sh"
bind-key -r s choose-session
bind-key -r S run-shell -b "~/dotfiles/scripts/tmux_lndev_sessions.sh --choose"
set -g visual-activity off
set -g visual-bell off
set -g visual-silence off
setw -g monitor-activity off
set -g bell-action none
bind-key r source-file ~/.tmux.conf \;
bind-key -r H resize-pane -L 5
bind-key -r J resize-pane -D 5
bind-key -r K resize-pane -U 5
bind-key -r L resize-pane -R 5
set-window-option -g mode-keys vi
setw -g clock-mode-colour yellow

setw -g mode-style 'fg=colour0 bg=colour13 bold'

set -g status on
set -g status-position top
set -g status-justify absolute-centre
set -g status-style "fg=colour250,bg=colour235"
set -g status-left "#[fg=colour250]#S #[fg=colour244]| #[fg=colour110]#W #[fg=colour244]| "
set -g status-left-length 60

# Firstmate fleet segment: fleet:wN nN bN fN dN
#   w = crews working, n = needs-decision (waiting on captain),
#   b = blocked, f = failed, d = done (finished, awaiting review/teardown).
# Counts only tasks with a live state/<id>.meta, so stale logs never inflate it.
set -g @firstmate-home "/Users/twaldin/firstmate"
set -g @fleet-status-script "~/dotfiles/scripts/tmux_fleet_status.sh"
set -g status-right "#[fg=colour244]#(FIRSTMATE_HOME=#{@firstmate-home} #{@fleet-status-script})"

setw -g window-status-current-style 'fg=colour13 bold'
setw -g window-status-current-format '#W#F'
setw -g window-status-style 'fg=white bold'
# Alert tabs keep the statusline bg (transparent look); marker is an orange bold "!".
setw -g monitor-activity on
setw -g window-status-format '#W#{?#{||:#{window_activity_flag},#{window_bell_flag}},#[fg=colour208]#[bold]!,#F}'
setw -g window-status-activity-style 'fg=colour250,bg=colour235'
setw -g window-status-bell-style 'fg=colour250,bg=colour235'
set -g pane-active-border-style 'fg=colour13'
set -g message-style 'fg=green bg=default bold'
set-option -g history-limit 100000

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @continuum-save-interval '5'
set -g @continuum-restore 'on'

run '~/.tmux/plugins/tpm/tpm'
