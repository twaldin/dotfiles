# deckbox (shepherd, Tim-approved 2026-10-06): automatic apt runs never restart these; they
# wait for the monthly patch window (apt full-upgrade + reboot). Everything else may restart.
# Agents and their hosts, containers, the vault and the services the box exists for:
$nrconf{override_rc}{qr(^herdr@)} = 0;
$nrconf{override_rc}{qr(^easld@)} = 0;
$nrconf{override_rc}{qr(^docker)} = 0;
$nrconf{override_rc}{qr(^containerd)} = 0;
$nrconf{override_rc}{qr(^deckbox-agent)} = 0;
$nrconf{override_rc}{qr(^browser-vault)} = 0;
$nrconf{override_rc}{qr(^vault-)} = 0;
# Also deferred (their restart drops every tailnet session, the site or its database):
$nrconf{override_rc}{qr(^tailscaled)} = 0;
$nrconf{override_rc}{qr(^floydpro-cloudflared)} = 0;
$nrconf{override_rc}{qr(^postgresql)} = 0;
# Non-interactive: restart the rest automatically; no kernel prompt.
$nrconf{restart} = "a";
$nrconf{kernelhints} = 0;
